[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#1A1A1A"
font = "sans serif"

[server]
headless = true
runOnSave = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
